name: Publish app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Clips recorded on earlier runs, so only new words and phrases are recorded
      - name: Restore recorded voice clips
        uses: actions/cache/restore@v4
        with:
          path: audio
          key: voice-${{ github.run_id }}
          restore-keys: voice-

      # If recording fails the app still works, using the phone's own voice
      - name: Record new phrases with the Hebrew voice
        id: voice
        continue-on-error: true
        env:
          # Google's Hebrew voice is used when this secret is set (Settings → Secrets and variables → Actions)
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          GOOGLE_TTS_VOICE: ${{ vars.GOOGLE_TTS_VOICE }}
        run: |
          pip install --quiet "edge-tts>=7,<8"
          python tools/make_audio.py
      - name: "Voice clips: ${{ steps.voice.outputs.clips || 0 }} with ${{ steps.voice.outputs.voice || 'no voice' }} (${{ steps.voice.outcome }})"
        run: ls audio/*.mp3 2>/dev/null | wc -l

      - name: Save recorded voice clips
        if: always()
        uses: actions/cache/save@v4
        with:
          path: audio
          key: voice-${{ github.run_id }}

      # Project rule: no file over 300 lines (see CLAUDE.md). Reported here, never blocks publishing.
      - name: Check file lengths
        id: lines
        run: |
          longest=$(git ls-files | xargs wc -l | grep -v ' total$' | sort -n | tail -1)
          echo "longest=$(echo $longest | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          git ls-files | xargs wc -l | grep -v ' total$' | awk '$1 > 300 {print "::warning::" $2 " has " $1 " lines (limit 300)"}'
      - name: "Longest file: ${{ steps.lines.outputs.longest }} lines"
        run: "true"

      - name: Build the site
        run: |
          sh build.sh
          mkdir -p _site
          cp -r index.html styles.css js manifest.json icon.svg words.txt _site/
          if [ -f audio/index.json ]; then cp -r audio _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
