<title>מדברים ומשחקים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Rubik:wght@500&family=Varela+Round&display=swap">
<style>
/* Layout: one-screen sticker-book app, right to left. Header bar, one big play card, giant mic button anchored at the bottom. */
:root {
  --paper: #FFF9EC;
  --card: #FFFFFF;
  --ink: #1E2A4A;
  --muted: #5B6688;
  --sun: #FFB627;
  --sea: #0E8F86;
  --berry: #D7385F;
  --line: #EADFC6;
  --guide: #CBD5EC;
  --on-accent: #FFFFFF;
  --display: "Fredoka", "Varela Round", "Arial Hebrew", system-ui, sans-serif;
  --body: "Varela Round", "Arial Hebrew", "Trebuchet MS", system-ui, sans-serif;
  --letters: "Rubik", "Arial Hebrew", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14203A; --card: #1D2B4C; --ink: #F4F1FF; --muted: #A9B4D6;
    --sun: #FFC24D; --sea: #34C9BE; --berry: #FF6F91; --line: #2D3E68;
    --guide: #3A4D7C; --on-accent: #10192E; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #14203A; --card: #1D2B4C; --ink: #F4F1FF; --muted: #A9B4D6;
  --sun: #FFC24D; --sea: #34C9BE; --berry: #FF6F91; --line: #2D3E68;
  --guide: #3A4D7C; --on-accent: #10192E; color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--body); font-size: 18px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%; box-sizing: border-box; max-width: 640px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }

/* Header */
.top { display: flex; align-items: center; gap: 12px; }
.top h1 { font-family: var(--display); font-weight: 700; font-size: 1.55rem; margin: 0; flex: 1; line-height: 1.1; }
.icon-btn {
  width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--line);
  background: var(--card); font-size: 1.4rem; display: grid; place-items: center;
}
.stars {
  font-family: var(--display); font-weight: 700; font-size: 1.25rem;
  background: var(--card); border: 2px solid var(--line); border-radius: 999px;
  padding: 4px 14px; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.stars.pop { animation: pop .5s ease; }
@keyframes pop { 40% { transform: scale(1.35) rotate(6deg); } }

/* Screens */
main { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
.screen { display: flex; flex-direction: column; gap: 14px; flex: 1; }
.hello { font-family: var(--display); font-size: 1.9rem; font-weight: 700; margin: 8px 0 0; line-height: 1.15; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; }

.tiles { display: grid; gap: 14px; }
.tile {
  display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 16px;
  text-align: start; border: 0; border-radius: 28px; padding: 20px;
  box-shadow: 0 6px 0 rgba(0,0,0,.14);
}
.tile:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.14); }
.tile .pic { font-size: 3.4rem; line-height: 1; }
.tile strong { display: block; font-family: var(--display); font-weight: 700; font-size: 1.6rem; line-height: 1.15; }
.tile span { font-size: .95rem; opacity: .92; }
.tile.write { background: var(--sea); color: var(--on-accent); }
.tile.guess { background: var(--sun); color: #2A1E00; }

.say-list { margin: 0; padding: 14px 16px; list-style: none; display: grid; gap: 6px;
  background: var(--card); border: 2px dashed var(--line); border-radius: 18px; font-size: .95rem; }
.say-list b { font-family: var(--display); font-weight: 600; }
.label { font-size: .8rem; color: var(--muted); font-weight: 700; }

.card { background: var(--card); border: 2px solid var(--line); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

/* Writing game */
.word-head { display: flex; align-items: center; gap: 14px; }
.word-pic { font-size: 3.2rem; line-height: 1; }
.letters { display: flex; flex-wrap: wrap; gap: 6px; }
.letters span {
  font-family: var(--letters); font-weight: 500; font-size: 2rem; min-width: 44px; text-align: center;
  padding: 0 6px; border-radius: 12px; background: var(--paper); border: 2px solid var(--line);
  transition: transform .15s, background .15s;
}
.letters span.on { background: var(--sun); color: #2A1E00; border-color: var(--sun); transform: translateY(-4px) scale(1.1); }
.trace { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; max-height: 38vh;
  border-radius: 18px; background: var(--paper); border: 2px solid var(--line); overflow: hidden; touch-action: none; }
.trace canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  flex: 1 1 auto; min-height: 52px; border-radius: 16px; border: 2px solid var(--line);
  background: var(--card); font-family: var(--display); font-weight: 600; font-size: 1.1rem; padding: 6px 14px;
}
.btn.main { background: var(--sea); border-color: var(--sea); color: var(--on-accent); }
.feedback { min-height: 1.45em; margin: 0; font-family: var(--display); font-weight: 600; font-size: 1.15rem; text-align: center; }
.feedback.good { color: var(--sea); }
.feedback.try { color: var(--berry); }

/* Animal game */
.mystery {
  align-self: center; width: 150px; height: 150px; border-radius: 50%;
  background: var(--paper); border: 4px dashed var(--sun);
  display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 5rem; line-height: 1;
}
.mystery.found { border-style: solid; border-color: var(--sea); animation: pop .6s ease; }
.clue { font-size: 1.3rem; text-align: center; margin: 0; text-wrap: balance; }
.dots { display: flex; justify-content: center; gap: 8px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--sun); }
.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.choice { border: 2px solid var(--line); background: var(--paper); border-radius: 18px; padding: 10px 4px;
  display: grid; gap: 2px; justify-items: center; font-family: var(--display); font-weight: 600; }
.choice .e { font-size: 2.4rem; line-height: 1.1; }

/* Mic */
.dock { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.mic {
  width: 84px; height: 84px; border-radius: 50%; border: 0; background: var(--berry); color: var(--on-accent);
  display: grid; place-items: center; box-shadow: 0 6px 0 rgba(0,0,0,.18);
}
.mic svg { width: 40px; height: 40px; }
.mic.listening { animation: pulse 1.1s ease-in-out infinite; background: var(--sea); }
.mic.off { opacity: .55; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--sea) 60%, transparent); } 50% { box-shadow: 0 0 0 18px transparent; } }
.status { margin: 0; color: var(--muted); font-size: .95rem; text-align: center; min-height: 1.45em; text-wrap: balance; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="app" dir="rtl" lang="he">
  <header class="top">
    <button class="icon-btn" id="homeBtn" aria-label="מסך ראשי">🏠</button>
    <h1>מדברים ומשחקים</h1>
    <div class="stars" id="stars" aria-label="כוכבים שהרווחתם">⭐ 0</div>
  </header>

  <main>
    <!-- Home -->
    <section class="screen" id="home">
      <p class="hello">שלום! במה נשחק?</p>
      <p class="sub">לוחצים על משחק, או לוחצים על המיקרופון האדום ואומרים את השם שלו.</p>
      <div class="tiles">
        <button class="tile write" id="goWrite">
          <span class="pic">✏️</span>

        <button class="tile guess" id="goGuess">
          <span class="pic">🦁</span>
          <span><strong>מנחשים חיות</strong><span>אומרים: ״חיות״</span></span>
        </button>
      </div>
      <ul class="say-list">
        <li class="label">מה אפשר להגיד</li>
        <li><b>״איך כותבים כלב?״</b> ללמוד לכתוב כל מילה</li>
        <li><b>״שוב״</b> או <b>״הבא״</b> לשמוע שוב או להמשיך</li>
        <li><b>״רמז״</b> לשמוע עוד רמז על החיה</li>
        <li><b>״הביתה״</b> לחזור לכאן</li>
      </ul>
    </section>

    <!-- Writing -->
    <section class="screen" id="write" hidden>
      <div class="card">
        <div class="word-head">
          <div class="word-pic" id="wordPic">🐱</div>
          <div class="letters" id="letters" aria-live="polite"></div>
        </div>
        <div class="trace" id="trace">
          <canvas id="guideCv"></canvas>
          <canvas id="inkCv" aria-label="מעבירים את האצבע על האותיות"></canvas>
        </div>
        <p class="feedback" id="writeFb"></p>
        <div class="row">
          <button class="btn" id="spellBtn">🔊 איות</button>
          <button class="btn" id="clearBtn">🧽 מחיקה</button>
        </div>
        <div class="row">
          <button class="btn main" id="doneBtn">סיימתי!</button>
          <button class="btn" id="nextWordBtn">מילה הבאה ←</button>
        </div>
      </div>
    </section>

    <!-- Animals -->
    <section class="screen" id="guess" hidden>
      <div class="card">
        <div class="mystery" id="mystery">?</div>
        <div class="dots" id="dots"></div>
        <p class="clue" id="clue"></p>
        <p class="feedback" id="guessFb"></p>
        <div class="choices" id="choices" hidden></div>
        <div class="row">
          <button class="btn" id="hearBtn">🔊 שוב</button>
          <button class="btn" id="hintBtn">💡 רמז</button>
          <button class="btn main" id="nextAnimalBtn">חיה חדשה ←</button>
        </div>
      </div>
    </section>
  </main>

  <div class="dock">
    <button class="mic" id="mic" aria-label="לוחצים ומדברים">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/></svg>
    </button>
    <p class="status" id="status" aria-live="polite">לוחצים על המיקרופון ומדברים</p>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let current = "home";
  const LANG = "he-IL";

  // ---------- Content ----------
  // [word as written, word with niqqud for the voice, picture]
  const WORDS = [
    ["חתול","חָתוּל","🐱"],["כלב","כֶּלֶב","🐶"],["שמש","שֶׁמֶשׁ","☀️"],["דג","דָּג","🐟"],
    ["כוכב","כּוֹכָב","⭐"],["עץ","עֵץ","🌳"],["כדור","כַּדּוּר","⚽"],["ירח","יָרֵחַ","🌙"],
    ["ספר","סֵפֶר","📖"],["עוגה","עוּגָה","🎂"],["תפוח","תַּפּוּחַ","🍎"],["אמא","אִמָּא","👩"],
    ["אבא","אַבָּא","👨"],["לב","לֵב","❤️"],["בית","בַּיִת","🏠"],["פרח","פֶּרַח","🌸"],
    ["ים","יָם","🌊"],["גשם","גֶּשֶׁם","🌧️"],["בננה","בָּנָנָה","🍌"],["גלידה","גְּלִידָה","🍦"]
  ];
  // How the voice says each letter's name
  const LETTER_NAMES = {
    "א":"אָלֶף","ב":"בֵּית","ג":"גִּימֶל","ד":"דָּלֶת","ה":"הֵא","ו":"וָו","ז":"זַיִן","ח":"חֵית",
    "ט":"טֵית","י":"יוּד","כ":"כַּף","ך":"כַּף סוֹפִית","ל":"לָמֶד","מ":"מֵם","ם":"מֵם סוֹפִית",
    "נ":"נוּן","ן":"נוּן סוֹפִית","ס":"סָמֶךְ","ע":"עַיִן","פ":"פֵּא","ף":"פֵּא סוֹפִית","צ":"צָדִי",
    "ץ":"צָדִי סוֹפִית","ק":"קוֹף","ר":"רֵישׁ","ש":"שִׁין","ת":"תָּו"
  };
  // alt: the words that count as a right answer (written without niqqud or apostrophes)
  const ANIMALS = [
    { name: "אריה", e: "🦁", alt: ["אריה","אריות","לביא"], clues: ["אני חתול גדול עם רעמה מפוארת.", "קוראים לי מלך החיות.", "אני שואג: גררררר!"] },
    { name: "פיל", e: "🐘", alt: ["פיל","פילים","פילון"], clues: ["אני ענק ואפור.", "יש לי אוזניים גדולות שמתנפנפות.", "יש לי חדק ארוך במקום אף."] },
    { name: "ג׳ירפה", e: "🦒", alt: ["גירפה","גרפה","גירפות"], clues: ["אני החיה הכי גבוהה בעולם.", "יש לי כתמים חומים על כל הגוף.", "הצוואר הארוך שלי עוזר לי לאכול עלים מהעצים."] },
    { name: "קוף", e: "🐒", alt: ["קוף","קופיף","קופים","שימפנזה"], clues: ["אני אוהב לטפס ולהתנדנד על עצים.", "יש לי זנב ארוך וידיים זריזות.", "המאכל הכי אהוב עליי הוא בננה!"] },
    { name: "פינגווין", e: "🐧", alt: ["פינגווין","פינגוין","פינגווינים"], clues: ["אני ציפור, אבל אני לא יכול לעוף.", "אני גר במקום קר מאוד עם הרבה קרח.", "אני הולך ומתנדנד בחליפה שחורה ולבנה."] },
    { name: "צפרדע", e: "🐸", alt: ["צפרדע","צפרדעים","קרפדה"], clues: ["אני יכולה לקפוץ ממש רחוק.", "כשהייתי קטנה הייתי ראשן שוחה במים.", "אני ירוקה ואני עושה: קְוָוה קְוָוה!"] },
    { name: "פרה", e: "🐄", alt: ["פרה","פרות"], clues: ["אני גרה ברפת.", "אני אוכלת עשב כל היום.", "אני נותנת חלב ואני עושה: מוּוּוּ!"] },
    { name: "כלב", e: "🐶", alt: ["כלב","כלבלב","כלבה","כלבים"], clues: ["אני חיית מחמד שאוהבת להביא כדור.", "אני מכשכש בזנב כשאני שמח.", "אני עושה: הַב הַב!"] },
    { name: "חתול", e: "🐱", alt: ["חתול","חתולה","חתלתול","חתולים"], clues: ["אני חיית מחמד עם פרווה רכה ושפם.", "אני אוהב לרדוף אחרי כדור צמר.", "אני עושה: מְיָאוּ!"] },
    { name: "ינשוף", e: "🦉", alt: ["ינשוף","ינשופים"], clues: ["אני ציפור שערה כל הלילה.", "יש לי עיניים גדולות ועגולות.", "אני עושה: הוּ, הוּ!"] },
    { name: "נחש", e: "🐍", alt: ["נחש","נחשים"], clues: ["אין לי רגליים, אבל אני זז מהר.", "העור שלי מכוסה בקשקשים.", "אני עושה: ססססס!"] },
    { name: "ארנב", e: "🐰", alt: ["ארנב","ארנבת","ארנבון","ארנבים","שפן"], clues: ["יש לי אוזניים ארוכות מאוד.", "אני קופץ ואוהב לאכול גזר.", "יש לי זנב קטן ופרוותי."] },
    { name: "צב", e: "🐢", alt: ["צב","צבים"], clues: ["אני זז לאט, לאט מאוד.", "אני סוחב את הבית שלי על הגב.", "כשאני מפחד אני מתחבא בתוך השריון."] },
    { name: "זברה", e: "🦓", alt: ["זברה","זברות"], clues: ["אני דומה מאוד לסוס.", "אני גרה במישורים של אפריקה.", "יש לי פסים שחורים ולבנים."] },
    { name: "חזיר", e: "🐷", alt: ["חזיר","חזירון","חזירים"], clues: ["אני גר בחווה ואוהב להתפלש בבוץ.", "אני ורוד ויש לי זנב מסולסל.", "אני עושה: אוֹינְק אוֹינְק!"] }
  ];
  const PRAISE = ["כל הכבוד!", "מעולה!", "יופי!", "אלופים!", "וואו, איזה יופי!"];
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);

  // Hebrew text helpers: drop niqqud, apostrophes and punctuation so speech results compare cleanly
  const clean = t => t.replace(/[֑-ׇ'"׳״`]/g, "").replace(/[.,!?;:־-]/g, " ").replace(/\s+/g, " ").trim();
  // A spoken word matches a name with or without a one-letter prefix (הכלב, וכלב, זה כלב)
  const PREFIXES = "הובלכמש";
  const wordMatches = (w, n) => w === n || (w.length === n.length + 1 && PREFIXES.includes(w[0]) && w.slice(1) === n);
  const saidAny = (alts, names) => alts.some(a => a.split(" ").some(w => names.some(n => wordMatches(w, n))));
  const saysPhrase = (alts, phrases) => alts.some(a => phrases.some(p => a.includes(p)));

  // ---------- Stars ----------
  let stars = 0;
  try { stars = parseInt(localStorage.getItem("tp-stars"), 10) || 0; } catch (e) {}
  const renderStars = () => { $("stars").textContent = "⭐ " + stars; };
  function addStar() {
    stars++;
    try { localStorage.setItem("tp-stars", String(stars)); } catch (e) {}
    renderStars();
    const el = $("stars"); el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
  }
  renderStars();

  // ---------- Talking (text to speech) ----------
  const canSpeak = "speechSynthesis" in window;
  let voice = null;
  function pickVoice() {
    const vs = speechSynthesis.getVoices().filter(v => /^(he|iw)/i.test(v.lang));
    voice = vs.find(v => /google|carmit|hila|avri/i.test(v.name)) || vs[0] || null;
  }
  if (canSpeak) {
    pickVoice();
    speechSynthesis.onvoiceschanged = pickVoice;
    setTimeout(() => {
      if (!voice && speechSynthesis.getVoices().length && !voiceBlocked)
        setStatus("בטלפון הזה עוד אין קול בעברית. אפשר להוסיף אותו בהגדרות הטלפון, תחת ״הקראה״ או ״טקסט לדיבור״.");
    }, 2000);
  }

  let speakToken = 0;
  function say(text, rate = 0.9) {
    return new Promise(resolve => {
      if (!canSpeak) return resolve();
      const token = ++speakToken;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      if (voice) u.voice = voice;
      u.lang = voice ? voice.lang : LANG;
      u.rate = rate; u.pitch = 1.1;
      let done = false;
      const finish = () => { if (!done) { done = true; resolve(token === speakToken); } };
      u.onend = finish; u.onerror = finish;
      speechSynthesis.speak(u);
      setTimeout(finish, 1500 + text.length * 120); // some phones never fire onend
    });
  }
  const hush = () => { speakToken++; if (canSpeak) speechSynthesis.cancel(); };

  // ---------- Listening (speech to text) ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false, voiceBlocked = !SR;
  const mic = $("mic"), statusEl = $("status");
  const setStatus = t => { statusEl.textContent = t; };
  if (voiceBlocked) markNoVoice("הדפדפן הזה לא יכול להקשיב. לוחצים על הכפתורים, או פותחים את האפליקציה ב-Chrome או ב-Safari.");

  function markNoVoice(msg) {
    voiceBlocked = true;
    mic.classList.add("off");
    setStatus(msg);
    if (current === "guess") showChoices();
  }

  function listen() {
    return new Promise((resolve, reject) => {
      hush();
      rec = new SR();
      rec.lang = LANG; rec.interimResults = false; rec.maxAlternatives = 5;
      let got = false;
      rec.onresult = e => {
        got = true;
        resolve(Array.from(e.results[0]).map(a => clean(a.transcript)).filter(Boolean));
      };
      rec.onerror = e => { if (!got) reject(e.error); };
      rec.onend = () => { setListening(false); if (!got) resolve([]); };
      setListening(true);
      try { rec.start(); } catch (err) { setListening(false); reject("not-allowed"); }
    });
  }
  function setListening(on) {
    listening = on;
    mic.classList.toggle("listening", on);
    if (on) setStatus("מקשיבים…");
  }

  mic.addEventListener("click", async () => {
    if (voiceBlocked) { say("לוחצים על הכפתורים הגדולים כדי לשחק!"); return; }
    if (listening) { rec && rec.stop(); return; }
    try {
      const heard = await listen();
      if (!heard.length) { setStatus("לא שמעתי כלום. לוחצים ומנסים שוב!"); return; }
      setStatus("שמעתי: ״" + heard[0] + "״");
      handle(heard);
    } catch (err) {
      if (err === "not-allowed" || err === "service-not-allowed" || err === "audio-capture") {
        markNoVoice("המיקרופון כבוי כאן. לוחצים על הכפתורים, או פותחים את האפליקציה בדף משלה.");
      } else if (err === "no-speech") {
        setStatus("לא שמעתי כלום. לוחצים ומנסים שוב!");
      } else if (err === "language-not-supported") {
        markNoVoice("הטלפון הזה לא מזהה דיבור בעברית. לוחצים על הכפתורים במקום.");
      } else {
        setStatus("אופס, לא הצלחתי להקשיב. לוחצים על המיקרופון ומנסים שוב.");
      }
    }
  });

  // ---------- Commands ----------
  const SKIP_WORDS = new Set(["מילים","מילה","משהו","עוד","לי","אותי","את","אותה","אותו","זה"]);
  const HOME = ["הביתה","תפריט","מסך ראשי","להתחלה","עצור"];
  const WANT_GUESS = ["חיה","חיות","לנחש","ניחוש","חידה","חידות"];
  const WANT_WRITE = ["כתיב","לכתוב","כותבים","מילים","מילה","אותיות","לאיית"];

  function handle(alts) {
    // "איך כותבים כלב", "תלמד אותי לכתוב שמש", "לכתוב את המילה ים"
    for (const a of alts) {
      const m = a.match(/(?:לכתוב|כותבים|כותב|כותבת|לאיית|מאייתים)(?: את)?(?: המילה)? ([א-ת]+)/);
      if (m && !SKIP_WORDS.has(m[1])) { startWrite(m[1]); return; }
    }
    if (saysPhrase(alts, HOME)) { goHome(); return; }
    if (current !== "guess" && saysPhrase(alts, WANT_GUESS)) { startGuess(); return; }
    if (current !== "write" && saysPhrase(alts, WANT_WRITE)) { startWrite(); return; }
    if (current === "write") return handleWrite(alts);
    if (current === "guess") return handleGuess(alts);
    say("אפשר להגיד: כתיבה, או חיות.");
  }

  // ---------- Screens ----------
  function show(id) {
    current = id;
    for (const s of ["home", "write", "guess"]) $(s).hidden = s !== id;
  }
  function goHome() {
    hush(); show("home");
    if (!voiceBlocked) setStatus("לוחצים על המיקרופון ומדברים");
    say("במה נשחק?");
  }
  $("homeBtn").onclick = goHome;
  $("goWrite").onclick = () => startWrite();
  $("goGuess").onclick = () => startGuess();

  // ---------- Writing game ----------
  let word = "", spoken = "", wordIdx = -1, drawn = 0, earnedWord = false;
  const guideCv = $("guideCv"), inkCv = $("inkCv"), trace = $("trace");
  const gctx = guideCv.getContext("2d"), ictx = inkCv.getContext("2d");
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  function startWrite(custom) {
    show("write");
    if (custom) {
      // Accept the word with a prefix too ("הכלב" → "כלב")
      const found = WORDS.find(w => wordMatches(custom, w[0]));
      word = found ? found[0] : custom;
      spoken = found ? found[1] : custom;
      $("wordPic").textContent = found ? found[2] : "✏️";
    } else {
      let i; do { i = Math.floor(Math.random() * WORDS.length); } while (i === wordIdx && WORDS.length > 1);
      wordIdx = i; [word, spoken] = WORDS[i]; $("wordPic").textContent = WORDS[i][2];
    }
    earnedWord = false;
    $("letters").innerHTML = "";
    for (const ch of word) { const s = document.createElement("span"); s.textContent = ch; $("letters").appendChild(s); }
    setFb("writeFb", "");
    sizeCanvases();
    if (document.fonts) document.fonts.ready.then(() => { if (current === "write") { const r = trace.getBoundingClientRect(); drawGuide(r.width, r.height); } });
    if (!voiceBlocked) setStatus("אומרים את המילה, או אומרים ״הבא״");
    spell(true);
  }

  async function spell(intro) {
    const spans = [...$("letters").children];
    const chars = [...word];
    if (intro && !(await say("בואו נכתוב: " + spoken + "!"))) return;
    for (let i = 0; i < chars.length; i++) {
      spans.forEach((s, j) => s.classList.toggle("on", j === i));
      if (!(await say(LETTER_NAMES[chars[i]] || chars[i], 0.8))) { spans.forEach(s => s.classList.remove("on")); return; }
    }
    spans.forEach(s => s.classList.remove("on"));
    if (!(await say(spoken + "!"))) return;
    if (intro) say("עכשיו מעבירים את האצבע על האותיות האפורות.");
  }

  function sizeCanvases() {
    const r = trace.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    for (const cv of [guideCv, inkCv]) {
      cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
      cv.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    drawGuide(r.width, r.height);
    drawn = 0;
  }

  function drawGuide(w, h) {
    gctx.clearRect(0, 0, w, h);
    // Writing lines: letters sit between the top line and the baseline; ק and final letters drop below it
    const top = h * 0.2, base = h * 0.7;
    gctx.lineWidth = 2;
    gctx.strokeStyle = css("--muted");
    gctx.globalAlpha = 0.5;
    gctx.setLineDash([]);
    [top, base].forEach(y => { gctx.beginPath(); gctx.moveTo(12, y); gctx.lineTo(w - 12, y); gctx.stroke(); });
    gctx.globalAlpha = 1;

    const font = s => `500 ${s}px Rubik, "Arial Hebrew", sans-serif`;
    let size = (base - top) * 1.4;
    gctx.font = font(size);
    const measured = gctx.measureText(word).width;
    if (measured > w * 0.88) size *= (w * 0.88) / measured;
    gctx.font = font(size);
    gctx.direction = "rtl";
    gctx.textAlign = "center"; gctx.textBaseline = "alphabetic";
    gctx.fillStyle = css("--guide");
    gctx.fillText(word, w / 2, base);
    gctx.setLineDash([6, 7]);
    gctx.lineWidth = 2;
    gctx.strokeStyle = css("--muted");
    gctx.strokeText(word, w / 2, base);
    gctx.setLineDash([]);
  }

  // Finger drawing
  let pen = null;
  inkCv.addEventListener("pointerdown", e => {
    inkCv.setPointerCapture(e.pointerId);
    pen = { x: e.offsetX, y: e.offsetY };
    ictx.lineCap = "round"; ictx.lineJoin = "round";
    ictx.lineWidth = Math.max(8, trace.clientHeight / 22);
    ictx.strokeStyle = css("--sea");
  });
  inkCv.addEventListener("pointermove", e => {
    if (!pen) return;
    ictx.beginPath(); ictx.moveTo(pen.x, pen.y); ictx.lineTo(e.offsetX, e.offsetY); ictx.stroke();
    drawn += Math.hypot(e.offsetX - pen.x, e.offsetY - pen.y);
    pen = { x: e.offsetX, y: e.offsetY };
  });
  const penUp = () => { pen = null; };
  inkCv.addEventListener("pointerup", penUp);
  inkCv.addEventListener("pointercancel", penUp);

  function clearInk() { const r = trace.getBoundingClientRect(); ictx.clearRect(0, 0, r.width, r.height); drawn = 0; }

  function setFb(id, text, kind) {
    const el = $(id); el.textContent = text; el.className = "feedback" + (kind ? " " + kind : "");
  }

  function wordDone() {
    if (drawn < 60) { setFb("writeFb", "קודם מעבירים את האצבע על האותיות!", "try"); say("קודם מעבירים את האצבע על האותיות האפורות."); return; }
    const p = pick(PRAISE);
    setFb("writeFb", p + " ⭐", "good");
    if (!earnedWord) { earnedWord = true; addStar(); }
    say(p + " המילה " + spoken + " כתובה! אומרים הַבָּא למילה חדשה.");
  }

  function handleWrite(alts) {
    if (saysPhrase(alts, ["מחק", "ניקוי", "לנקות", "תנקה", "תנקי"])) { clearInk(); return say("הכול נקי. מנסים שוב!"); }
    if (saysPhrase(alts, ["סיימתי", "גמרתי", "סיימנו"])) return wordDone();
    if (saidAny(alts, [word])) {
      setFb("writeFb", "נכון! " + word + " ⭐", "good");
      if (!earnedWord) { earnedWord = true; addStar(); }
      return say("נכון! " + spoken + ". " + pick(PRAISE));
    }
    if (saysPhrase(alts, ["שוב", "עוד פעם", "חזור", "תחזור", "תחזרי", "איות", "לאיית", "אותיות"])) return spell(false);
    if (saysPhrase(alts, ["הבא", "הבאה", "אחרת", "חדשה", "דלג", "עוד מילה"])) return startWrite();
    setFb("writeFb", "מנסים להגיד: ״" + word + "״", "try");
    say("הממ. אפשר להגיד " + spoken + "?");
  }

  $("spellBtn").onclick = () => spell(false);
  $("clearBtn").onclick = clearInk;
  $("doneBtn").onclick = wordDone;
  $("nextWordBtn").onclick = () => startWrite();
  let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (current === "write") sizeCanvases(); }, 150); });

  // ---------- Animal game ----------
  let animal = null, clueAt = 0, solved = false, lastAnimal = -1;

  function startGuess() {
    show("guess");
    let i; do { i = Math.floor(Math.random() * ANIMALS.length); } while (i === lastAnimal);
    lastAnimal = i; animal = ANIMALS[i]; clueAt = 0; solved = false;
    $("mystery").textContent = "?"; $("mystery").classList.remove("found");
    $("choices").hidden = true; $("choices").innerHTML = "";
    setFb("guessFb", "");
    renderClue();
    if (voiceBlocked) showChoices();
    else setStatus("לוחצים על המיקרופון ואומרים את שם החיה");
    say("נחשו מי אני! " + animal.clues[0]);
  }

  function renderClue() {
    $("clue").textContent = animal.clues[clueAt];
    $("dots").innerHTML = animal.clues.map((_, i) => `<i class="${i <= clueAt ? "on" : ""}"></i>`).join("");
  }

  function showChoices() {
    if (!animal || solved || !$("choices").hidden) return;
    const others = shuffle(ANIMALS.filter(a => a !== animal)).slice(0, 2);
    $("choices").innerHTML = "";
    for (const a of shuffle([animal, ...others])) {
      const b = document.createElement("button");
      b.className = "choice";
      b.innerHTML = `<span class="e">${a.e}</span><span>${a.name}</span>`;
      b.onclick = () => guess([a.alt[0]]);
      $("choices").appendChild(b);
    }
    $("choices").hidden = false;
  }

  function nextClue() {
    if (solved) return;
    if (clueAt < animal.clues.length - 1) {
      clueAt++; renderClue();
      if (clueAt === animal.clues.length - 1) showChoices();
      return say(animal.clues[clueAt]);
    }
    showChoices();
    say("זה היה הרמז האחרון. מי אני?");
  }

  function guess(alts) {
    if (solved) return;
    if (saidAny(alts, animal.alt)) {
      solved = true;
      $("mystery").textContent = animal.e; $("mystery").classList.add("found");
      $("choices").hidden = true;
      addStar();
      setFb("guessFb", "נכון! זה " + animal.name + "! ⭐", "good");
      return say("נכון! אני " + animal.name + "! " + pick(PRAISE) + " אומרים הַבָּא לחיה חדשה.");
    }
    const named = ANIMALS.find(a => saidAny(alts, a.alt));
    setFb("guessFb", named ? "זה לא " + named.name + ". מנסים שוב!" : "לא בדיוק. מנסים שוב!", "try");
    if (clueAt < animal.clues.length - 1) {
      clueAt++; renderClue();
      if (clueAt === animal.clues.length - 1) showChoices();
      return say((named ? "אני לא " + named.name + ". " : "לא בדיוק! ") + "הנה עוד רמז: " + animal.clues[clueAt]);
    }
    showChoices();
    say("לא בדיוק! מסתכלים על התמונות. מי אני?");
  }

  function reveal() {
    if (solved) return;
    solved = true;
    $("mystery").textContent = animal.e; $("mystery").classList.add("found");
    $("choices").hidden = true;
    setFb("guessFb", "זה היה " + animal.name + "!", "good");
    say("הייתי " + animal.name + "! בואו ננסה עוד אחת.");
  }

  function handleGuess(alts) {
    if (saysPhrase(alts, ["לא יודע", "לא יודעת", "מוותר", "מוותרת", "תגיד", "תגידי"])) return reveal();
    if (saysPhrase(alts, ["רמז", "עזרה", "תעזור", "תעזרי"])) return nextClue();
    if (saysPhrase(alts, ["שוב", "עוד פעם", "חזור", "תחזור", "תחזרי"])) return say(animal.clues[clueAt]);
    if (saysPhrase(alts, ["הבא", "הבאה", "חדשה", "אחרת", "דלג", "עוד חיה"])) return startGuess();
    guess(alts);
  }

  $("hearBtn").onclick = () => animal && say(animal.clues[clueAt]);
  $("hintBtn").onclick = nextClue;
  $("nextAnimalBtn").onclick = startGuess;
})();
</script>
